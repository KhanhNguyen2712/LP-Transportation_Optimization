[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "transportopt"
version = "0.1.0"
description = "Transportation optimization with linear programming"
requires-python = ">=3.11"
dependencies = ["numpy", "scipy", "pandas", "streamlit"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
